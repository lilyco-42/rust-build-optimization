[package]
name = "ip-speed"
version = "0.1.0"
edition = "2021"

[dependencies]
lilyco = { git = "https://github.com/lilyco-42/lilyco", package = "lilyco", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# dev = 速度最大（与 ip-base 对齐，共享 target 时依赖指纹一致可复用）
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

# C组 = 速度优先：O3 + thin LTO + 多 codegen 并行 + 保留符号
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = "none"
debug = false
